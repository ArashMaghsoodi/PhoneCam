<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>PhoneCam</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="panel">
  <header class="brand">
    <h1>PhoneCam</h1>
    <span id="dot" class="dot"></span>
    <button id="hidePanel" class="icon" title="Nascondi pannello (tasto P)" aria-label="Nascondi pannello" aria-expanded="true">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>
  <p id="status" class="status">Avvio…</p>

  <section class="group">
    <h2>Telefono</h2>
    <p id="device" class="device">Nessun telefono</p>
  </section>

  <section class="group">
    <h2>Fotocamera</h2>
    <label>Obiettivo<select id="camera" disabled></select></label>
    <button id="restoreCameras" class="link" hidden></button>
    <label>Risoluzione<select id="size" disabled></select></label>
    <div class="pair">
      <label>FPS<select id="fps" disabled></select></label>
      <label>Qualità<select id="quality">
        <option value="4000000">Bassa</option>
        <option value="8000000">Media</option>
        <option value="16000000">Alta</option>
        <option value="32000000">Massima</option>
      </select></label>
    </div>
    <p class="hint">La messa a fuoco è automatica e continua.</p>
  </section>

  <section class="group">
    <h2>Zoom e luce</h2>
    <div class="pair">
      <button id="zoomOut" title="Riduci zoom (tasto −)">−</button>
      <span id="zoomValue" class="zoom">1×</span>
      <button id="zoomIn" title="Aumenta zoom (tasto +)">+</button>
    </div>
    <label class="switch"><input type="checkbox" id="torch"><span>Torcia</span></label>
  </section>

  <section class="group">
    <h2>Immagine</h2>
    <div class="pair">
      <button id="rotate" title="Ruota di 90° (tasto R)">Ruota</button>
      <button id="mirror" title="Specchia (tasto M)" aria-pressed="false">Specchia</button>
      <button id="fit" title="Adatta o riempi (tasto A)">Riempi</button>
    </div>
    <button id="fullscreen" class="primary" title="Schermo intero (F11 o doppio clic sull'immagine)">Schermo intero</button>
  </section>

  <footer id="stats" class="stats"></footer>
</aside>

<main id="stage">
  <canvas id="video"></canvas>
  <button id="showPanel" class="icon show-panel" title="Mostra pannello (tasto P)" aria-label="Mostra pannello" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 4v16" stroke="currentColor" stroke-width="2"/></svg>
  </button>
  <div id="notice" class="notice" role="status" hidden></div>
  <div id="placeholder" class="placeholder">
    <p id="placeholderText">Collega il telefono con il cavo USB</p>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
